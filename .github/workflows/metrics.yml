name: 📊 Profile metrics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    name: Render stat cards
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Overview card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          committer_branch: main
          filename: assets/metrics.svg
          template: classic
          base: header, repositories, metadata
          config_timezone: Asia/Yekaterinburg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages card
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          committer_branch: main
          filename: assets/metrics-languages.svg
          template: classic
          base: ""
          config_timezone: Asia/Yekaterinburg
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
